<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fleet Identifier — Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      width: min(1100px, 92%);
      margin: 0 auto;
      padding: 40px 0;
    }

    header {
      margin-bottom: 35px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .subtitle {
      color: #999;
      margin-top: 8px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 35px;
    }

    .card {
      background: #181818;
      border: 1px solid #2a2a2a;
      border-radius: 14px;
      padding: 22px;
    }

    .card-label {
      color: #999;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .card-value {
      font-size: 30px;
      font-weight: bold;
    }

    .section {
      background: #181818;
      border: 1px solid #2a2a2a;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
    }

    .section h2 {
      margin-top: 0;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      text-align: left;
      padding: 13px 10px;
      border-bottom: 1px solid #292929;
      white-space: nowrap;
    }

    th {
      color: #999;
      font-size: 13px;
    }

    .empty {
      color: #777;
      padding: 20px 0;
    }

    #status {
      color: #888;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>Fleet Identifier Admin</h1>
      <div class="subtitle">Sightings overview</div>
    </header>

    <div id="status">Loading dashboard...</div>

    <div class="stats">

      <div class="card">
        <div class="card-label">Total Sightings</div>
        <div class="card-value" id="totalSightings">—</div>
      </div>

      <div class="card">
        <div class="card-label">Unique Fleets</div>
        <div class="card-value" id="uniqueFleets">—</div>
      </div>

      <div class="card">
        <div class="card-label">Lines Reported</div>
        <div class="card-value" id="uniqueLines">—</div>
      </div>

      <div class="card">
        <div class="card-label">Sightings Today</div>
        <div class="card-value" id="todaySightings">—</div>
      </div>

    </div>

    <div class="section">
      <h2>Recent Sightings</h2>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Car</th>
              <th>Fleet</th>
              <th>Line</th>
              <th>Time</th>
              <th>Notes</th>
            </tr>
          </thead>

          <tbody id="sightingsTable">
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://jkgjektucefrtxkcngcw.supabase.co";
const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_Prb-Tm0UxZxc_lPG6iWbJQ_maolEsol";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

let sightings = [];

function showDenied(message) {
  document.getElementById("status").textContent = message;

  document.querySelector(".stats").style.display = "none";
  document.querySelector(".section").style.display = "none";
}

async function startAdminDashboard() {
  const status = document.getElementById("status");

  status.textContent = "Checking admin access...";

  try {
    // 1. Check whether somebody is signed in.
    const {
      data: { session },
      error: sessionError
    } = await supabaseClient.auth.getSession();

    if (sessionError) {
      console.error("Session error:", sessionError);
      showDenied("Could not verify your session.");
      return;
    }

    if (!session?.user) {
      showDenied(
        "You must be signed in to the Fleet Identifier to access this page."
      );
      return;
    }

    // 2. Read the signed-in user's profile.
    const {
      data: profile,
      error: profileError
    } = await supabaseClient
      .from("profiles")
      .select("id, username, admin")
      .eq("id", session.user.id)
      .single();

    if (profileError) {
      console.error("Profile error:", profileError);
      showDenied("Could not verify admin access.");
      return;
    }

    // 3. Stop here if this account is not an admin.
    if (profile?.admin !== true) {
      showDenied("Access denied. This account is not an administrator.");
      return;
    }

    status.textContent =
      `Signed in as ${profile.username || "administrator"} — loading dashboard...`;

    // 4. Because the user passed the admin check, request all sightings.
    // Supabase RLS still decides whether this request is actually allowed.
    const {
      data,
      error: sightingsError
    } = await supabaseClient
      .from("sightings")
      .select("id, user_id, car_number, fleet, line, created_at, notes")
      .order("created_at", { ascending: false });

    if (sightingsError) {
      console.error("Sightings error:", sightingsError);
      status.textContent = "Could not load sighting data.";
      return;
    }

    sightings = data || [];

    loadDashboard(profile);

  } catch (error) {
    console.error("Admin dashboard error:", error);
    showDenied("Something went wrong while loading the admin dashboard.");
  }
}

function loadDashboard(profile) {
  document.getElementById("totalSightings").textContent =
    sightings.length;

  document.getElementById("uniqueFleets").textContent =
    new Set(
      sightings
        .map(s => s.fleet)
        .filter(Boolean)
    ).size;

  document.getElementById("uniqueLines").textContent =
    new Set(
      sightings
        .map(s => s.line)
        .filter(Boolean)
    ).size;

  const today = new Date().toDateString();

  document.getElementById("todaySightings").textContent =
    sightings.filter(s =>
      s.created_at &&
      new Date(s.created_at).toDateString() === today
    ).length;

  const table = document.getElementById("sightingsTable");

  table.innerHTML = "";

  if (!sightings.length) {
    const row = document.createElement("tr");
    const cell = document.createElement("td");

    cell.colSpan = 5;
    cell.className = "empty";
    cell.textContent = "No sightings have been submitted yet.";

    row.appendChild(cell);
    table.appendChild(row);

    document.getElementById("status").textContent =
      `Admin access confirmed — signed in as ${profile.username || "administrator"}.`;

    return;
  }

  sightings
    .slice(0, 20)
    .forEach(sighting => {
      const row = document.createElement("tr");

      const values = [
        sighting.car_number ?? "—",
        sighting.fleet ?? "—",
        sighting.line ?? "—",
        sighting.created_at
          ? new Date(sighting.created_at).toLocaleString()
          : "—",
        sighting.notes ?? "—"
      ];

      values.forEach(value => {
        const cell = document.createElement("td");

        // User-submitted data is inserted as text, not HTML.
        cell.textContent = value;

        row.appendChild(cell);
      });

      table.appendChild(row);
    });

  document.getElementById("status").textContent =
    `Admin access confirmed — signed in as ${profile.username || "administrator"}.`;
}

startAdminDashboard();
</script>

  
</body>
</html>
