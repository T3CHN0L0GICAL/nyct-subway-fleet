<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fleet Identifier — Admin</title>
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    button {
      font: inherit;
    }

    .container {
      width: min(1100px, 92%);
      margin: 0 auto;
      padding: 40px 0;
    }

    header {
      margin-bottom: 35px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .subtitle {
      color: #999;
      margin-top: 8px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 35px;
    }

    .card {
      background: #181818;
      border: 1px solid #2a2a2a;
      border-radius: 14px;
      padding: 22px;
    }

    .card-label {
      color: #999;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .card-value {
      font-size: 30px;
      font-weight: bold;
    }

    .section {
      background: #181818;
      border: 1px solid #2a2a2a;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
    }

    .section h2 {
      margin-top: 0;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      text-align: left;
      padding: 13px 10px;
      border-bottom: 1px solid #292929;
      white-space: nowrap;
    }

    th {
      color: #999;
      font-size: 13px;
    }

    .empty {
      color: #777;
      padding: 20px 0;
    }

    #status {
      color: #888;
      margin-bottom: 20px;
    }

    .delete-button {
      border: 1px solid #703737;
      background: #2b1717;
      color: #ff9b9b;
      border-radius: 8px;
      padding: 7px 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
    }

    .delete-button:hover {
      background: #3a1c1c;
    }

    .delete-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>Fleet Identifier Admin</h1>
      <div class="subtitle">Sightings overview</div>
    </header>

    <div id="status">Loading dashboard...</div>

    <div class="stats">

      <div class="card">
        <div class="card-label">Total Sightings</div>
        <div class="card-value" id="totalSightings">—</div>
      </div>

      <div class="card">
        <div class="card-label">Unique Fleets</div>
        <div class="card-value" id="uniqueFleets">—</div>
      </div>

      <div class="card">
        <div class="card-label">Lines Reported</div>
        <div class="card-value" id="uniqueLines">—</div>
      </div>

      <div class="card">
        <div class="card-label">Sightings Today</div>
        <div class="card-value" id="todaySightings">—</div>
      </div>

    </div>

    <!-- Recent Sightings -->
    <div class="section">
      <h2>Recent Sightings</h2>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Car</th>
              <th>Fleet</th>
              <th>Line</th>
              <th>Time</th>
              <th>Notes</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="sightingsTable">
          </tbody>
        </table>
      </div>
    </div>

    <!-- User Management -->
    <div class="section">
      <h2>User Management</h2>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Username</th>
              <th>Display Name</th>
              <th>Joined</th>
              <th>Admin</th>
            </tr>
          </thead>

          <tbody id="usersTable">
            <tr>
              <td colspan="4" class="empty">
                Loading users...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://jkgjektucefrtxkcngcw.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_Prb-Tm0UxZxc_lPG6iWbJQ_maolEsol";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    let sightings = [];
    let profiles = [];
    let currentAdminProfile = null;

    function showDenied(message) {
      document.getElementById("status").textContent = message;

      document.querySelector(".stats").style.display = "none";

      document
        .querySelectorAll(".section")
        .forEach(section => {
          section.style.display = "none";
        });
    }

    async function startAdminDashboard() {
      const status = document.getElementById("status");

      status.textContent = "Checking admin access...";

      try {
        const {
          data: { session },
          error: sessionError
        } = await supabaseClient.auth.getSession();

        if (sessionError) {
          console.error("Session error:", sessionError);
          showDenied("Could not verify your session.");
          return;
        }

        if (!session?.user) {
          showDenied(
            "You must be signed in to the Fleet Identifier to access this page."
          );
          return;
        }

        const {
          data: profile,
          error: profileError
        } = await supabaseClient
          .from("profiles")
          .select("id, username, admin")
          .eq("id", session.user.id)
          .single();

        if (profileError) {
          console.error("Profile error:", profileError);
          showDenied("Could not verify admin access.");
          return;
        }

        if (profile?.admin !== true) {
          showDenied(
            "Access denied. This account is not an administrator."
          );
          return;
        }

        currentAdminProfile = profile;

        status.textContent =
          `Signed in as ${profile.username || "administrator"} — loading dashboard...`;

        const {
          data: sightingsData,
          error: sightingsError
        } = await supabaseClient
          .from("sightings")
          .select(
            "id, user_id, car_number, fleet, line, saved_at, notes"
          )
          .order("saved_at", { ascending: false });

        if (sightingsError) {
          console.error(
            "Sightings error:",
            sightingsError
          );

          status.textContent =
            "Could not load sighting data.";

          return;
        }

        sightings = sightingsData || [];

        const {
          data: profilesData,
          error: profilesError
        } = await supabaseClient
          .from("profiles")
          .select("*");

        if (profilesError) {
          console.error(
            "Profiles error:",
            profilesError
          );

          profiles = [];
        } else {
          profiles = profilesData || [];
        }

        loadDashboard(profile);
        loadUsers();

      } catch (error) {
        console.error(
          "Admin dashboard error:",
          error
        );

        showDenied(
          "Something went wrong while loading the admin dashboard."
        );
      }
    }

    function loadDashboard(profile) {
      document.getElementById(
        "totalSightings"
      ).textContent = sightings.length;

      document.getElementById(
        "uniqueFleets"
      ).textContent =
        new Set(
          sightings
            .map(s => s.fleet)
            .filter(Boolean)
        ).size;

      document.getElementById(
        "uniqueLines"
      ).textContent =
        new Set(
          sightings
            .map(s => s.line)
            .filter(Boolean)
        ).size;

      const today = new Date().toDateString();

      document.getElementById(
        "todaySightings"
      ).textContent =
        sightings.filter(s =>
          s.saved_at &&
          new Date(s.saved_at).toDateString() === today
        ).length;

      const table =
        document.getElementById("sightingsTable");

      table.innerHTML = "";

      if (!sightings.length) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");

        cell.colSpan = 6;
        cell.className = "empty";
        cell.textContent =
          "No sightings have been submitted yet.";

        row.appendChild(cell);
        table.appendChild(row);

      } else {
        sightings
          .slice(0, 20)
          .forEach(sighting => {
            const row =
              document.createElement("tr");

            const values = [
              sighting.car_number ?? "—",
              sighting.fleet ?? "—",
              sighting.line ?? "—",
              sighting.saved_at
                ? new Date(
                    sighting.saved_at
                  ).toLocaleString()
                : "—",
              sighting.notes ?? "—"
            ];

            values.forEach(value => {
              const cell =
                document.createElement("td");

              cell.textContent = value;
              row.appendChild(cell);
            });

            const actionsCell =
              document.createElement("td");

            const deleteButton =
              document.createElement("button");

            deleteButton.type = "button";
            deleteButton.className = "delete-button";
            deleteButton.textContent = "Delete";

            deleteButton.addEventListener(
              "click",
              () => deleteSighting(
                sighting,
                deleteButton
              )
            );

            actionsCell.appendChild(deleteButton);
            row.appendChild(actionsCell);

            table.appendChild(row);
          });
      }

      document.getElementById(
        "status"
      ).textContent =
        `Admin access confirmed — signed in as ${profile.username || "administrator"}.`;
    }

    async function deleteSighting(
      sighting,
      button
    ) {
      if (!sighting?.id) {
        alert(
          "This sighting does not have a valid ID."
        );
        return;
      }

      const car =
        sighting.car_number ?? "this sighting";

      const confirmed = window.confirm(
        `Delete sighting for car ${car}?\n\nThis cannot be undone.`
      );

      if (!confirmed) {
        return;
      }

      button.disabled = true;
      button.textContent = "Deleting...";

      try {
        const {
          error
        } = await supabaseClient
          .from("sightings")
          .delete()
          .eq("id", sighting.id);

        if (error) {
          console.error(
            "Delete sighting error:",
            error
          );

          alert(
            "Could not delete this sighting."
          );

          button.disabled = false;
          button.textContent = "Delete";
          return;
        }

        sightings = sightings.filter(
          item => item.id !== sighting.id
        );

        loadDashboard(
          currentAdminProfile
        );

      } catch (error) {
        console.error(
          "Delete sighting error:",
          error
        );

        alert(
          "Something went wrong while deleting this sighting."
        );

        button.disabled = false;
        button.textContent = "Delete";
      }
    }

    function loadUsers() {
      const table =
        document.getElementById("usersTable");

      table.innerHTML = "";

      if (!profiles.length) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");

        cell.colSpan = 4;
        cell.className = "empty";
        cell.textContent =
          "No user profiles found.";

        row.appendChild(cell);
        table.appendChild(row);

        return;
      }

      profiles.forEach(profile => {
        const row = document.createElement("tr");

        const username =
          profile.username ?? "—";

        const displayName =
          profile.display_name ?? "—";

        const joined =
          profile.created_at
            ? new Date(
                profile.created_at
              ).toLocaleString()
            : "—";

        const admin =
          profile.admin === true
            ? "Yes"
            : "No";

        [
          username,
          displayName,
          joined,
          admin
        ].forEach(value => {
          const cell =
            document.createElement("td");

          cell.textContent = value;
          row.appendChild(cell);
        });

        table.appendChild(row);
      });
    }

    startAdminDashboard();
  </script>

</body>
</html>
