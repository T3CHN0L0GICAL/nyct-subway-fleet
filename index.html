<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>NYCT Subway Fleet Identifier</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #000;
        color: #fff;
    }

    header {
        background: #111;
        color: white;
        padding: 25px 15px;
        text-align: center;
    }

    header h1 {
        margin: 0 0 8px;
        font-size: 30px;
    }

    header p {
        margin: 0;
        color: #ccc;
    }

    main {
        max-width: 850px;
        margin: 35px auto;
        padding: 0 16px;
    }

    .search-box,
    .result {
        background: #000;
        color: #fff;
        border: 1px solid #333;
        border-radius: 14px;
        padding: 22px;
        box-shadow: 0 3px 14px rgba(255,255,255,0.08);
        margin-bottom: 20px;
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 8px;
    }

    .title-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
    }

    .title-row img {
        width: 55px;
        height: 55px;
        object-fit: contain;
    }

    .title-row h1 {
        margin: 0;
    }

    .input-row {
        display: flex;
        gap: 10px;
    }

    input {
        flex: 1;
        padding: 14px;
        font-size: 18px;
        border: 2px solid #555;
        border-radius: 9px;
        background: #fff;
        color: #000;
    }

    button {
        padding: 14px 22px;
        font-size: 17px;
        font-weight: bold;
        border: 1px solid #555;
        border-radius: 9px;
        background: #000;
        color: #fff;
        cursor: pointer;
    }

    button:hover {
        background: #333;
    }

    .hidden {
        display: none;
    }

    .fleet-title {
        color: #fff;
        font-size: 30px;
        font-weight: bold;
        margin-bottom: 5px;
    }

    .car-number {
        color: #ccc;
        margin-bottom: 20px;
    }

    .configuration {
        display: inline-block;
        background: #222;
        color: #fff;
        padding: 7px 11px;
        border-radius: 7px;
        font-weight: bold;
        margin-bottom: 18px;
    }

    .info {
        display: grid;
        grid-template-columns: 180px 1fr;
        border-top: 1px solid #333;
        color: #fff;
    }

    .info div {
        padding: 12px 5px;
        border-bottom: 1px solid #333;
    }

    .info .label {
        font-weight: bold;
        color: #fff;
    }

    .error {
        background: #fff0f0;
        color: #a00000;
        border: 1px solid #e0aaaa;
        padding: 15px;
        border-radius: 9px;
    }

    /* Secret message */
    .welcome-message {
        text-align: center;
        font-size: 24px;
        font-weight: bold;
        padding: 35px 10px;
        letter-spacing: 2px;
        color: #fff;
    }

    footer {
        text-align: center;
        color: #777;
        padding: 20px;
        font-size: 13px;
    }

    @media (max-width: 600px) {
        .input-row {
            flex-direction: column;
        }

        .info {
            grid-template-columns: 1fr;
        }

        .info .label {
            padding-bottom: 0;
            border-bottom: 0;
        }
    }

    :root {
        color-scheme: dark;
        --fi-bg: #000;
        --fi-header: #111;
        --fi-text: #fff;
        --fi-muted: #ccc;
        --fi-border: #333;
        --fi-chip: #222;
        --fi-hover: #333;
        --fi-shadow: rgba(255,255,255,0.08);
    }

    html[data-theme="light"] {
        color-scheme: light;
        --fi-bg: #fff;
        --fi-header: #eee;
        --fi-text: #000;
        --fi-muted: #444;
        --fi-border: #ccc;
        --fi-chip: #eee;
        --fi-hover: #ddd;
        --fi-shadow: rgba(0,0,0,0.10);
    }

    @media (prefers-color-scheme: light) {
        html[data-theme="system"] {
            color-scheme: light;
            --fi-bg: #fff;
            --fi-header: #eee;
            --fi-text: #000;
            --fi-muted: #444;
            --fi-border: #ccc;
            --fi-chip: #eee;
            --fi-hover: #ddd;
            --fi-shadow: rgba(0,0,0,0.10);
        }
    }

    body { background: var(--fi-bg); color: var(--fi-text); }
    header { background: var(--fi-header); color: var(--fi-text); }
    header p, .car-number { color: var(--fi-muted); }
    .search-box, .result, .settings-panel {
        background: var(--fi-bg);
        color: var(--fi-text);
        border-color: var(--fi-border);
        box-shadow: 0 3px 14px var(--fi-shadow);
    }
    button {
        background: var(--fi-bg);
        color: var(--fi-text);
        border-color: var(--fi-border);
    }
    button:hover { background: var(--fi-hover); }
    .fleet-title, .info, .info .label, .welcome-message { color: var(--fi-text); }
    .configuration { background: var(--fi-chip); color: var(--fi-text); }
    .info { border-top-color: var(--fi-border); }
    .info div { border-bottom-color: var(--fi-border); }

    .settings-row {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 14px;
    }
    .settings-panel {
        border: 1px solid var(--fi-border);
        border-radius: 14px;
        padding: 18px;
        margin-bottom: 20px;
    }
    .settings-panel h2 { margin: 0 0 14px; font-size: 21px; }
    .settings-panel select {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        border: 1px solid var(--fi-border);
        border-radius: 9px;
        background: #fff;
        color: #000;
    }

    .unknown-value {
        color: #ff2d2d;
        font-weight: bold;
        letter-spacing: 0.5px;
    }

    .sighting-panel {
        margin-top: 20px;
        padding-top: 18px;
        border-top: 1px solid var(--fi-border);
    }

    .sighting-panel h3 {
        margin: 0 0 12px;
    }

    .line-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(52px, 1fr));
        gap: 8px;
        margin: 12px 0;
    }

    .line-button.selected {
        outline: 2px solid var(--fi-text);
        background: var(--fi-hover);
    }

    .status-message {
        margin-top: 12px;
        color: var(--fi-muted);
        font-weight: bold;
    }

    .report-box {
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid var(--fi-border);
    }

    .report-box textarea {
        width: 100%;
        min-height: 90px;
        resize: vertical;
        padding: 12px;
        border: 1px solid var(--fi-border);
        border-radius: 9px;
        font: inherit;
        margin: 8px 0;
    }

    .shuttle-mark {
        display: inline-flex;
        align-items: flex-start;
        justify-content: center;
        min-width: 1.2em;
        line-height: 1;
    }

    .shuttle-mark .shuttle-s {
        font-size: 1em;
        line-height: 1;
    }

    .shuttle-mark .shuttle-suffix {
        font-size: 0.55em;
        line-height: 1;
        margin-left: 0.05em;
        transform: translateY(-0.28em);
        text-transform: uppercase;
        font-weight: 800;
    }


    .account-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 14px;
    }

    .account-status {
        color: var(--fi-muted);
        font-size: 14px;
    }

    .account-panel {
        background: var(--fi-bg);
        color: var(--fi-text);
        border: 1px solid var(--fi-border);
        border-radius: 14px;
        padding: 20px;
        margin-bottom: 20px;
    }

    .account-panel h2 {
        margin: 0 0 14px;
        font-size: 22px;
    }

    .account-tabs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
    }

    .account-tabs button.active {
        outline: 2px solid var(--fi-text);
        background: var(--fi-hover);
    }

    .account-form {
        display: grid;
        gap: 12px;
    }

    .account-form.hidden {
        display: none;
    }

    .account-form input {
        width: 100%;
    }

    .account-message {
        margin-top: 12px;
        font-weight: bold;
        color: var(--fi-muted);
        white-space: pre-wrap;
    }

    .account-message.error-text {
        color: #ff4d4d;
    }

    .signed-in-card {
        display: grid;
        gap: 10px;
    }

    .signed-in-name {
        font-size: 22px;
        font-weight: bold;
    }

    .signed-in-email {
        color: var(--fi-muted);
        word-break: break-word;
    }

    .account-small-note {
        color: var(--fi-muted);
        font-size: 13px;
        line-height: 1.4;

    body.focus-mode .search-box,
    body.focus-mode #result,
    body.focus-mode footer {

        margin-top: 20px;
    }

<header>
    <div class="title-row">
        <img src="mta-logo.png" alt="MTA Logo">
        <h1>NYCT Subway Fleet Identifier</h1>
    </div>

    <p>Enter a subway car number to identify its fleet.</p>
</header>

<main>





    <div id="settingsControls" class="settings-row">
        <button type="button" onclick="toggleSettings()" aria-controls="settingsPanel">Settings</button>
    </div>

    <section id="settingsPanel" class="settings-panel hidden">
        <h2>Settings</h2>
        <label for="themeSelect">Appearance</label>
        <select id="themeSelect" onchange="setTheme(this.value)">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
            <option value="system">System</option>
        </select>

        <div style="margin-top:18px;padding-top:18px;border-top:1px solid var(--fi-border);">
            <button type="button" onclick="toggleAccountPanel()">Account</button>
            <div style="margin-top:12px;">
                <button type="button" onclick="toggleSightingsPanel()">My Sightings</button>
            </div>
        </div>

    <section id="accountPanel" class="account-panel hidden">
        <div id="signedOutView">
            <h2>Fleet Identifier Account</h2>

            <div class="account-tabs">
                <button id="loginTabButton" type="button" class="active" onclick="showAccountTab('login')">Log In</button>
                <button id="signupTabButton" type="button" onclick="showAccountTab('signup')">Create Account</button>
            </div>

            <form id="loginForm" class="account-form" onsubmit="logIn(event)">
                <div>
                    <label for="loginEmail">Email</label>
                    <input id="loginEmail" type="email" autocomplete="email" required>
                </div>

                <div>
                    <label for="loginPassword">Password</label>
                    <input id="loginPassword" type="password" autocomplete="current-password" required>
                </div>

                <button type="submit">Log In</button>
            </form>

            <form id="signupForm" class="account-form hidden" onsubmit="createAccount(event)">
                <div>
                    <label for="signupUsername">Username</label>
                    <input id="signupUsername" type="text" autocomplete="username" minlength="3" maxlength="30" required>
                </div>

                <div>
                    <label for="signupDisplayName">Display name</label>
                    <input id="signupDisplayName" type="text" maxlength="50" required>
                </div>

                <div>
                    <label for="signupEmail">Email</label>
                    <input id="signupEmail" type="email" autocomplete="email" required>
                </div>

                <div>
                    <label for="signupPassword">Password</label>
                    <input id="signupPassword" type="password" autocomplete="new-password" minlength="8" required>
                </div>

                <div>
                    <label for="signupPasswordConfirm">Confirm password</label>
                    <input id="signupPasswordConfirm" type="password" autocomplete="new-password" minlength="8" required>
                </div>

                <div class="account-small-note">
                    You will be asked to confirm your email before the account can be used.
                </div>

                <button type="submit">Create Account</button>
            </form>

            <div id="accountMessage" class="account-message"></div>
        </div>

        <div id="signedInView" class="hidden">
            <div class="signed-in-card">
                <div id="signedInName" class="signed-in-name">Signed in</div>
                <div id="signedInUsername"></div>
                <div id="signedInEmail" class="signed-in-email"></div>
                <button type="button" onclick="logOut()">Log Out</button>
            </div>
        </div>
    </section>

    <section id="mySightingsPanel" class="account-panel hidden">
        <h2>My Sightings</h2>
        <div id="mySightingsStatus" class="status-message">Loading sightings...</div>
        <div id="mySightingsList"></div>
    </section>
    </section>

    <section class="search-box">

        <label for="carNumber">Car Number</label>

        <div class="input-row">

            <input
                id="carNumber"
                type="text"
                inputmode="numeric"
                placeholder="Example: 4045"
                autocomplete="off"
            >

            <button onclick="identify()">Identify</button>

        </div>

    </section>

    <section id="result" class="result hidden"></section>

</main>

<footer>
    New York City Transit Subway Fleet Identifier
</footer>

<script>


const savedTheme = localStorage.getItem("fleetIdentifierTheme") || "dark";
document.documentElement.setAttribute("data-theme", savedTheme);

function setTheme(theme) {
    if (!["dark", "light", "system"].includes(theme)) return;
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem("fleetIdentifierTheme", theme);
}

function toggleSettings() {
    const settingsPanel = document.getElementById("settingsPanel");
    const opening = settingsPanel.classList.contains("hidden");

    settingsPanel.classList.toggle("hidden", !opening);

    if (!opening) {
        document.getElementById("accountPanel").classList.add("hidden");
    }

    updateFocusMode();
}

window.addEventListener("DOMContentLoaded", function() {
    const select = document.getElementById("themeSelect");
    if (select) select.value = savedTheme;
});

function inRange(number, ranges) {

    return ranges.some(function(range) {
        return number >= range[0] && number <= range[1];
    });

}


function identifyNumeric(number) {

    // R46 special numbers
    if (number >= 5482 && number <= 6207) {
        return ["R46", null];
    }

    if (
        number >= 6208 &&
        number <= 6258 &&
        number % 2 === 0
    ) {
        return ["R46", null];
    }


    // R160B subtypes
    if (number >= 8713 && number <= 8842) {
        return ["R160B", "R160B-1"];
    }

    if (number >= 8843 && number <= 9102) {
        return ["R160B", "R160B-2"];
    }

    if (number >= 9103 && number <= 9232) {
        return ["R160B", "R160B-1"];
    }

    if (number >= 9803 && number <= 9942) {
        return ["R160B", "R160B-1"];
    }


    // R160A configurations
    if (number >= 8313 && number <= 8652) {
        return ["R160A", "4-car set"];
    }

    if (number >= 8653 && number <= 8712) {
        return ["R160A", "5-car set"];
    }

    if (number >= 9233 && number <= 9802) {
        return ["R160A", "5-car set"];
    }

    if (number >= 9943 && number <= 9974) {
        return ["R160A", "4-car set"];
    }


    // R179 configurations
    if (number >= 3010 && number <= 3049) {
        return ["R179", "5-car set"];
    }

    if (number >= 3050 && number <= 3237) {
        return ["R179", "4-car set"];
    }

    if (number >= 3238 && number <= 3327) {
        return ["R179", "5-car set"];
    }


    // General fleet lookup
    for (const fleet in fleetData) {

        if (inRange(number, fleetData[fleet].ranges)) {
            return [fleet, null];
        }

    }

    return null;
}

function chooseLine(line) {
    if (!pendingSighting) return;

async function saveSighting() {
    if (!pendingSighting) return;

    const status = document.getElementById("sightingStatus");

    if (!pendingSighting.line) {
        if (status) {
            status.textContent = "Choose the line you saw this car on first.";
        }
        return;
    }

    const {
        data: { session }
    } = await supabaseClient.auth.getSession();

    if (!session?.user) {
        if (status) {
            status.textContent = "You need to be signed in to save sightings to the cloud.";
        }
        return;
    }

    if (status) {
        status.textContent = "Saving sighting...";
    }

    const { error } = await supabaseClient
        .from("sightings")
        .insert({
            user_id: session.user.id,
            car_number: pendingSighting.carNumber,
            fleet: pendingSighting.fleet,
            line: pendingSighting.line
        });

    if (error) {
        console.error("Could not save sighting:", error);

        if (status) {
            status.textContent = "Could not save sighting. Please try again.";
        }
        return;
    }

    if (status) {
        status.textContent =
            `Saved: car ${pendingSighting.carNumber} on the ${pendingSighting.line} line.`;
    }
}

function reportMissingCar(carNumber) {
    const fleetGuess = document.getElementById("reportFleetGuess")?.value.trim() || "";
    const line = document.getElementById("reportLine")?.value || "";
    const notes = document.getElementById("reportNotes")?.value.trim() || "";

    const reports = JSON.parse(localStorage.getItem("fleetIdentifierMissingReports") || "[]");
    reports.unshift({
        carNumber,
        fleetGuess,
        line,
        notes,
        reportedAt: new Date().toISOString(),
        syncStatus: "local-only"
    });
    localStorage.setItem("fleetIdentifierMissingReports", JSON.stringify(reports));

    const status = document.getElementById("reportStatus");
    if (status) {
        status.textContent = "Report saved on this device. Online submission will be enabled when accounts/sync are added.";
    }
}

    return `<option value="">Select line (optional)</option>` +
        linesForDivision(division).map(line => {

                line === "Rockaway S" ? "Sᴿ — Rockaway Park" :

            return `<option value="${line}">${label}</option>`;

function guessedDivisionFromFleetName(fleetName) {
    const normalized = fleetName.trim().toUpperCase();
    if (!normalized) return "";

    for (const fleet in fleetData) {
        if (fleet.toUpperCase() === normalized) {
            return fleetData[fleet].division;
        }
    }
    return "";
}

function updateReportLineOptions() {
    const fleetInput = document.getElementById("reportFleetGuess");
    const lineSelect = document.getElementById("reportLine");
    const note = document.getElementById("reportDivisionNote");
    if (!fleetInput || !lineSelect) return;

    const division = guessedDivisionFromFleetName(fleetInput.value);
    if (!division) {
        lineSelect.innerHTML = `<option value="">Enter a recognized fleet first</option>`;
        lineSelect.disabled = true;
        if (note) note.textContent = "Enter a fleet such as R211A or R62A to show compatible lines.";
        return;
    }

    lineSelect.disabled = false;
    lineSelect.innerHTML = reportLineOptionsHTML(division);
    if (note) note.textContent = `Showing ${division} sighting options.`;
}

<script>

function updateFocusMode() {

function escapeHTML(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

async function loadMySightings() {
    const status = document.getElementById("mySightingsStatus");
    const list = document.getElementById("mySightingsList");

    status.textContent = "Loading sightings...";
    list.innerHTML = "";

    const { data: { session }, error: sessionError } =
        await supabaseClient.auth.getSession();

    if (sessionError || !session?.user) {
        status.textContent = "Sign in to view your saved sightings.";
        return;
    }

    const { data, error } = await supabaseClient
        .from("sightings")
        .select("id, car_number, fleet, line, saved_at")
        .eq("user_id", session.user.id)
        .order("saved_at", { ascending: false });

    if (error) {
        console.error("Could not load sightings:", error);
        status.textContent = "Could not load your sightings. Please try again.";
        return;
    }

    if (!data || data.length === 0) {
        status.textContent = "You haven't saved any sightings yet.";
        return;
    }

    status.textContent = `${data.length} saved sighting${data.length === 1 ? "" : "s"}`;

    list.innerHTML = data.map(sighting => {
        const date = sighting.saved_at
            ? new Date(sighting.saved_at).toLocaleString()
            : "";

        return `
            <div style="padding:14px 0;border-bottom:1px solid var(--fi-border);">
                <div style="font-size:20px;font-weight:bold;">
                    ${escapeHTML(sighting.fleet)} — Car ${escapeHTML(sighting.car_number)}
                </div>
                <div style="margin-top:5px;">
                    Line: <strong>${escapeHTML(sighting.line)}</strong>
                </div>
                <div class="account-small-note" style="margin-top:5px;">
                    ${escapeHTML(date)}
                </div>
                <button type="button"
                        style="margin-top:10px;"
                        onclick="deleteSighting(${Number(sighting.id)})">
                    Delete
                </button>
            </div>
        `;
    }).join("");
}

async function deleteSighting(id) {
    if (!Number.isFinite(Number(id))) return;

    const status = document.getElementById("mySightingsStatus");
    status.textContent = "Deleting sighting...";

    const { error } = await supabaseClient
        .from("sightings")
        .delete()
        .eq("id", Number(id));

    if (error) {
        console.error("Could not delete sighting:", error);
        status.textContent = "Could not delete sighting. Please try again.";
        return;
    }

    await loadMySightings();
}

function showAccountTab(tab) {
    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");
    const loginButton = document.getElementById("loginTabButton");
    const signupButton = document.getElementById("signupTabButton");
    const message = document.getElementById("accountMessage");

    if (message) {
        message.textContent = "";
        message.classList.remove("error-text");
    }

    const loginActive = tab === "login";
    loginForm.classList.toggle("hidden", !loginActive);
    signupForm.classList.toggle("hidden", loginActive);
    loginButton.classList.toggle("active", loginActive);
    signupButton.classList.toggle("active", !loginActive);

function setAccountMessage(message, isError = false) {
    const el = document.getElementById("accountMessage");
    if (!el) return;
    el.textContent = message;
    el.classList.toggle("error-text", isError);
}

async function createAccount(event) {
    event.preventDefault();

    const username = document.getElementById("signupUsername").value.trim();
    const displayName = document.getElementById("signupDisplayName").value.trim();
    const email = document.getElementById("signupEmail").value.trim();
    const password = document.getElementById("signupPassword").value;
    const confirmPassword = document.getElementById("signupPasswordConfirm").value;

    if (password !== confirmPassword) {
        setAccountMessage("Passwords do not match.", true);
        return;
    }

    setAccountMessage("Creating account...");

    const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: {
            emailRedirectTo: window.location.origin + window.location.pathname,
            data: {
                username,
                display_name: displayName
            }
        }
    });

    if (error) {
        setAccountMessage(error.message, true);
        return;
    }

    document.getElementById("signupForm").reset();

    if (data.session) {
        setAccountMessage("Account created and signed in.");
    } else {
        setAccountMessage("Account created. Check your email and confirm your address, then return here and log in.");
    }
}

async function logIn(event) {
    event.preventDefault();

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    setAccountMessage("Logging in...");

    const { error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
    });

    if (error) {
        setAccountMessage(error.message, true);
        return;
    }

    document.getElementById("loginForm").reset();
    setAccountMessage("");
}

async function logOut() {
    const { error } = await supabaseClient.auth.signOut();

        alert("Could not log out: " + error.message);
    }
}

async function getUserDisplay(user) {
    if (!user) {
        return {
            username: "",
            displayName: "Fleet Identifier User"
        };
    }

    const { data, error } = await supabaseClient
        .from("profiles")
        .select("username, display_name")
        .eq("id", user.id)
        .single();

    if (error) {
        console.error("Could not load profile:", error);

        const meta = user.user_metadata || {};

        return {
            username: meta.username || "",
            displayName:
                meta.display_name ||
                meta.username ||
                "Fleet Identifier User"
        };
    }

    return {
        username: data?.username || "",
        displayName:
            data?.display_name ||
            data?.username ||
            "Fleet Identifier User"
    };
}

async function renderAuthState(session) {
    const signedOutView = document.getElementById("signedOutView");
    const signedInView = document.getElementById("signedInView");

    if (!session?.user) {
        signedOutView.classList.remove("hidden");
        signedInView.classList.add("hidden");
        return;
    }

    const user = session.user;
    const profile = await getUserDisplay(user);

    signedOutView.classList.add("hidden");
    signedInView.classList.remove("hidden");

    document.getElementById("signedInName").textContent =
        profile.displayName;

    document.getElementById("signedInUsername").textContent =
        profile.username ? "@" + profile.username : "";

    document.getElementById("signedInEmail").textContent =
        user.email || "";
}

async function initializeAuth() {
    const { data, error } = await supabaseClient.auth.getSession();

    if (error) {
        console.error("Could not load Supabase session:", error);
        return;
    }

    await renderAuthState(data.session);

    supabaseClient.auth.onAuthStateChange(async (_event, session) => {
        await renderAuthState(session);
    });
}

initializeAuth();
